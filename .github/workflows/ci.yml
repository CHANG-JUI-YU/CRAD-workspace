name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  correctness:
    name: Correctness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm build
      # The canonical quality-gate registry owns the ordered correctness list.
      # This pipeline intentionally excludes build because the workspace above
      # is already built once for this job.
      - name: Required correctness gates
        run: pnpm quality:correctness:only

  # #153 requires the full non-coverage suite on both supported CI operating
  # systems. Coverage therefore remains a separate Ubuntu gate. Both CI jobs
  # select their steps from tools/quality-gates.ts so local preflight and CI do
  # not maintain independent required-gate lists.
  coverage:
    name: Coverage (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm build
      - name: Required coverage gates
        run: pnpm quality:coverage:only
