name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  correctness:
    name: Correctness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck:only
      # Typed lint intentionally uses the already-built workspace. The public
      # `pnpm lint` command remains convenient for standalone use, while CI
      # avoids a second build by calling the :only form directly.
      - name: Typed lint
        run: pnpm lint:only
      # The suite contains fsync/rename-heavy repository integration tests.
      # Parallel test files can saturate hosted-runner filesystems (especially
      # Windows), starving lock heartbeats and causing recovery/cleanup races.
      # Keep local Vitest parallelism, but make required CI correctness
      # deterministic while still executing the complete non-coverage suite.
      - name: Full test suite (serial files)
        run: pnpm exec vitest run --no-file-parallelism

  # #153 requires the full non-coverage suite on both supported CI operating
  # systems. Coverage therefore remains a separate Ubuntu gate, but it uses the
  # :only commands so this job does not rebuild the workspace a second time.
  coverage:
    name: Coverage (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm build
      - name: Package coverage gate
        run: pnpm test:coverage:only
      # Maintenance analyzers live outside packages/*/src, so keep their
      # coverage ownership explicit instead of diluting the package thresholds.
      - name: Maintenance tool coverage gate
        run: pnpm test:tools:coverage:only
