name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  correctness:
    name: Correctness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck:only
      # The suite contains fsync/rename-heavy repository integration tests.
      # Parallel test files can saturate hosted-runner filesystems (especially
      # Windows), starving lock heartbeats and causing recovery/cleanup races.
      # Keep local Vitest parallelism, but make required CI correctness
      # deterministic while still executing the complete non-coverage suite.
      - name: Full test suite (serial files)
        run: pnpm exec vitest run --no-file-parallelism

  # #153 requires the full non-coverage suite on both supported CI operating
  # systems. Coverage therefore remains a separate Ubuntu gate, but it uses the
  # :only command so this job does not rebuild the workspace a second time.
  coverage:
    name: Coverage (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm build
      - name: Coverage gate
        run: pnpm test:coverage:only
