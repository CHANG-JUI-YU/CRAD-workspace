name: Governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  pr-governance:
    name: PR governance
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Audit identity matcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify Audit issue identity fixtures
        run: python .github/scripts/audit_issue_identity.py --check-fixtures .github/scripts/audit_issue_identity_fixtures.json
      - name: Collect issue-closing candidates
        env:
          CANDIDATE_PATH: ${{ runner.temp }}/audit-closing-candidates.json
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          pr_number = os.environ["PR_NUMBER"]
          candidate_path = Path(os.environ["CANDIDATE_PATH"])
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          sources = [
              ("PR body", os.environ.get("PR_BODY", "") or ""),
              ("PR title", os.environ.get("PR_TITLE", "") or ""),
          ]
          page = 1
          while True:
              query = urllib.parse.urlencode({"per_page": 100, "page": page})
              commits = get_json(
                  f"https://api.github.com/repos/{repo}/pulls/{pr_number}/commits?{query}"
              )
              for commit in commits:
                  sha = commit.get("sha", "")[:12]
                  message = commit.get("commit", {}).get("message", "")
                  sources.append((f"commit {sha}", message))
              if len(commits) < 100:
                  break
              page += 1

          closing = re.compile(
              r"(?im)\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+"
              r"(?:(?:[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#)(\d+)\b"
          )
          references = {}
          for source, text in sources:
              for value in closing.findall(text):
                  references.setdefault(int(value), set()).add(source)

          candidates = []
          for number, found_in in sorted(references.items()):
              issue = get_json(f"https://api.github.com/repos/{repo}/issues/{number}")
              candidates.append(
                  {
                      "number": number,
                      "title": issue.get("title", ""),
                      "found_in": sorted(found_in),
                  }
              )

          candidate_path.write_text(json.dumps(candidates, ensure_ascii=False), encoding="utf-8")
          if candidates:
              print(f"Collected {len(candidates)} issue-closing candidate(s) for title classification.")
          else:
              print("No issue-closing keywords found in the PR body, title, or commit messages.")
          PY
      - name: Prevent Audit issues from closing at merge time
        env:
          CANDIDATE_PATH: ${{ runner.temp }}/audit-closing-candidates.json
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path(".github/scripts").resolve()))
          from audit_issue_identity import is_audit_issue_title

          candidates = json.loads(Path(os.environ["CANDIDATE_PATH"]).read_text(encoding="utf-8"))
          audit_closures = [candidate for candidate in candidates if is_audit_issue_title(candidate["title"])]

          if audit_closures:
              for candidate in audit_closures:
                  print(
                      f"::error::Audit issue #{candidate['number']} ({candidate['title']}) would be auto-closed from "
                      f"{', '.join(candidate['found_in'])}. Use 'Refs #<number>' instead; Audit issues close only "
                      "after merged-main CI, Security, and Governance push evidence succeeds."
                  )
              raise SystemExit(1)

          print("Closing keywords only target non-Audit issues; governance check passed.")
          PY

  main-provenance:
    name: Main provenance
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main Audit identity matcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify Audit issue identity fixtures
        run: python .github/scripts/audit_issue_identity.py --check-fixtures .github/scripts/audit_issue_identity_fixtures.json
      - name: Verify main head came through a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          sha = os.environ["MAIN_SHA"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          pull_requests = get_json(f"https://api.github.com/repos/{repo}/commits/{sha}/pulls")
          merged_to_main = [
              pr
              for pr in pull_requests
              if pr.get("merged_at") and pr.get("base", {}).get("ref") == "main"
          ]

          # GitHub's commit-to-PR association endpoint can omit a merge commit even
          # when that SHA is the PR's recorded merge_commit_sha. Fall back to an
          # exact merge SHA match over recently closed PRs; this remains fail-closed
          # for direct pushes because no commit-message heuristic is involved.
          if not merged_to_main:
              page = 1
              while page <= 10:
                  query = urllib.parse.urlencode(
                      {
                          "state": "closed",
                          "base": "main",
                          "sort": "updated",
                          "direction": "desc",
                          "per_page": 100,
                          "page": page,
                      }
                  )
                  closed_prs = get_json(f"https://api.github.com/repos/{repo}/pulls?{query}")
                  merged_to_main.extend(
                      pr
                      for pr in closed_prs
                      if pr.get("merged_at")
                      and pr.get("base", {}).get("ref") == "main"
                      and pr.get("merge_commit_sha") == sha
                  )
                  if merged_to_main or len(closed_prs) < 100:
                      break
                  page += 1

          if not merged_to_main:
              print(
                  f"::error::main@{sha} is not associated with a pull request merged into main. "
                  "Direct main pushes violate the normal green-main policy."
              )
              raise SystemExit(1)

          numbers = ", ".join(f"#{number}" for number in sorted({pr["number"] for pr in merged_to_main}))
          print(f"Verified main@{sha} originated from merged pull request(s): {numbers}")
          PY
