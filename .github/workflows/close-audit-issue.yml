name: Close audit issue

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Audit issue number to close
        required: true
        type: string
      main_sha:
        description: Expected current main SHA (leave empty to use current main)
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  verify-and-close:
    name: Verify green main and close Audit issue
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted Audit identity matcher from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Verify Audit issue identity fixtures
        run: python .github/scripts/audit_issue_identity.py --check-fixtures .github/scripts/audit_issue_identity_fixtures.json
      - name: Verify required main evidence and close issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          EXPECTED_MAIN_SHA: ${{ inputs.main_sha }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request
          from pathlib import Path

          sys.path.insert(0, str(Path(".github/scripts").resolve()))
          from audit_issue_identity import is_audit_issue_title

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          issue_number = os.environ["ISSUE_NUMBER"].strip()
          expected_sha = os.environ.get("EXPECTED_MAIN_SHA", "").strip()

          if not issue_number.isdigit():
              raise SystemExit("issue_number must be numeric")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          branch = get_json(f"https://api.github.com/repos/{repo}/branches/main")
          main_sha = branch["commit"]["sha"]
          if expected_sha and expected_sha != main_sha:
              raise SystemExit(
                  f"main moved: expected {expected_sha}, current main is {main_sha}. "
                  "Re-run against the current merged main SHA."
              )

          issue = get_json(f"https://api.github.com/repos/{repo}/issues/{issue_number}")
          title = issue.get("title", "")
          if not is_audit_issue_title(title):
              raise SystemExit(f"#{issue_number} is not an Audit issue: {title}")
          if issue.get("state") != "open":
              raise SystemExit(f"Audit issue #{issue_number} is already {issue.get('state')}")

          required_workflows = ("ci.yml", "security.yml", "governance.yml")
          for workflow in required_workflows:
              query = urllib.parse.urlencode(
                  {
                      "branch": "main",
                      "event": "push",
                      "head_sha": main_sha,
                      "status": "completed",
                      "per_page": 20,
                  }
              )
              runs = get_json(
                  f"https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?{query}"
              ).get("workflow_runs", [])
              successes = [run for run in runs if run.get("conclusion") == "success"]
              if not successes:
                  observed = [
                      f"#{run.get('run_number')}:{run.get('status')}/{run.get('conclusion')}"
                      for run in runs
                  ]
                  raise SystemExit(
                      f"No successful completed main push run for {workflow} at {main_sha}. "
                      f"Observed: {observed or 'none'}"
                  )
              print(
                  f"Verified {workflow}: run #{successes[0].get('run_number')} succeeded at {main_sha}."
              )

          payload = json.dumps({"state": "closed", "state_reason": "completed"}).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{issue_number}",
              data=payload,
              method="PATCH",
              headers={**headers, "Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request) as response:
              closed = json.load(response)
          print(
              f"Closed Audit issue #{issue_number} only after CI, Security, and Governance succeeded "
              f"on main@{main_sha}: {closed.get('html_url')}"
          )
          PY
